<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta - PayApp</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="card">
<div class="logo"><div class="mark">P</div><div class="name">PayApp</div></div>
<h1>Crear cuenta</h1>
<p class="sub">Registrate para empezar a cobrar. Tus datos viajan cifrados (HTTPS) y la contrasena se guarda de forma segura.</p>

<form id="form">
<label for="email">Email</label>
<input type="email" id="email" placeholder="tu@email.com" required>

<label for="password">Contrasena</label>
<input type="password" id="password" placeholder="Minimo 6 caracteres" required minlength="6">

<button type="submit" class="primary">Crear cuenta</button>
</form>
<p id="err" style="color:#dc2626;font-size:.85rem;margin-top:12px;display:none;"></p>
<p style="margin-top:18px;font-size:.9rem;color:#64748b;">Ya tienes cuenta? <a href="/login" style="color:#0EA54E;font-weight:600;">Entrar</a></p>
</div>

<script>
const form = document.getElementById('form');
const err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
e.preventDefault();
err.style.display = 'none';
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;
const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
const data = await res.json();
if (data.error) { err.textContent = data.error; err.style.display = 'block'; return; }
window.location.href = '/';
});
</script>
</body>
</html>
